<!DOCTYPE html>
<html lang="ru">
  <head>
  <meta charset="UTF-8">
  <style>
  body { width: 380px; padding: 12px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.controls { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.row { display: flex; gap: 8px; }
input, select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; outline: none; }
input:focus, select:focus { border-color: #007aff; }
.note-item { border-bottom: 1px solid #f0f0f0; padding: 10px 0; cursor: pointer; transition: background 0.2s; position: relative; }
.note-item:hover { background: #f9f9f9; }
.note-delete { position: absolute; top: 8px; right: 4px; border: none; background: none; color: #c0392b; font-size: 14px; line-height: 1; padding: 4px 6px; border-radius: 4px; cursor: pointer; opacity: 0; transition: opacity 0.15s, background 0.15s; }
.note-item:hover .note-delete { opacity: 0.7; }
.note-delete:hover { opacity: 1 !important; background: #fdecea; }
.note-title { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; }
.note-meta { font-size: 12px; color: #888; margin-top: 4px; display: flex; justify-content: space-between; }
.note-text { font-size: 13px; color: #444; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.empty { text-align: center; color: #999; padding: 20px 0; }
</style>
</head>
<body>
  <button id="forceRun" style="width: 100%; padding: 10px; background: #007aff; color: white; border: none; border-radius: 6px; cursor: pointer; margin-bottom: 12px; font-weight: 600;">
    Запустить вручную на странице
  </button>
  <div class="controls">
    <input type="text" id="search" placeholder="Поиск по названию или тексту...">
      <div class="row">
        <select id="emojiFilter">
          <option value="">Все статусы</option>
          <option value="✅">✅ Галочка</option>
          <option value="❌">❌ Крестик</option>
          <option value="❓">❓ Вопрос</option>
        </select>
        <select id="sortBy">
          <option value="timestamp_desc">Сначала новые</option>
          <option value="timestamp_asc">Сначала старые</option>
          <option value="price_asc">Цена: дешевле</option>
          <option value="price_desc">Цена: дороже</option>
        </select>
      </div>
  </div>
  <div id="notesList"></div>
  <script src="popup.js"></script>
</body>
</html>
